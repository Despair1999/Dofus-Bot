[package]
name = "dofus-companion"
default-run = "dofus-companion"
version = "0.2.2"
description = "Independent DOFUS Companion"
authors = ["DOFUS Companion contributors"]
edition = "2021"

[[bin]]
name = "companion-service-guard"
path = "src/bin/companion-service-guard.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
minisign-verify = "0.3"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
