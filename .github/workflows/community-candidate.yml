name: Community Windows candidate (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-candidate:
    runs-on: windows-latest
    environment: community-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - uses: astral-sh/setup-uv@v6
      - run: ./infrastructure/scripts/setup-translator.ps1
      - name: Stage version and updater signing configuration
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node infrastructure/community/prepare-candidate.mjs --apply
      - name: Retrieve and verify existing public catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content design/catalog-bundle.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path .data -Force | Out-Null
          Invoke-WebRequest -Uri $manifest.url -OutFile .data/release-catalog.sqlite
          if ((Get-FileHash .data/release-catalog.sqlite -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256) { throw 'Catalog checksum mismatch.' }
          if ((Get-Item .data/release-catalog.sqlite).Length -ne $manifest.size) { throw 'Catalog size mismatch.' }
          $env:COMPANION_CATALOG_PATH = (Resolve-Path .data/release-catalog.sqlite).Path
          node infrastructure/scripts/bundle-backend.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Backend bundling failed.' }
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build signed updater candidate without creating a release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COMPANION_CATALOG_PATH: ${{ github.workspace }}/.data/release-catalog.sqlite
        run: pnpm --filter @dofus/desktop tauri build --bundles nsis
      - name: Validate updater artifacts exist
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe.sig')
          if ($files.Count -ne 1 -or $files[0].Length -eq 0) { throw 'Expected one signed installer candidate.' }
      - run: node infrastructure/community/verify-candidate-signature.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: community-windows-signed-candidate
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            test-results/community-candidate-signature.json
          retention-days: 7
