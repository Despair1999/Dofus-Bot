name: Website · Firebase Hosting

on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'packages/community/**'
      - 'packages/core/src/market.ts'
      - 'apps/desktop/public/branding/**'
      - 'apps/desktop/public/classes/**'
      - 'apps/desktop/public/game-assets/worlds/1.webp'
      - 'firebase.json'
      - '.firebaserc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firebase-hosting.yml'
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/community/**'
      - 'packages/core/src/market.ts'
      - 'apps/desktop/public/branding/**'
      - 'apps/desktop/public/classes/**'
      - 'apps/desktop/public/game-assets/worlds/1.webp'
      - 'firebase.json'
      - '.firebaserc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:
    inputs:
      rotate_preview_password:
        description: 'Explicitly rotate preview access to WEBSITE_PASSWORD (otherwise preserve live verifier)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: pnpm
      - name: Install website packages only
        run: pnpm install --frozen-lockfile --filter @dofus/website...
      - name: Validate website
        run: |
          pnpm --filter @dofus/website typecheck
          pnpm --filter @dofus/website test
      - name: Validate static production build with ephemeral CI password
        env:
          VITE_SITE_URL: ${{ vars.WEBSITE_URL }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.DISCORD_PUBLIC_CLIENT_ID }}
        run: |
          # PRs must never receive the real password. The CI preview is not deployed.
          export WEBSITE_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          pnpm --filter @dofus/website build
      - name: Upload compiled static site
        uses: actions/upload-artifact@v4
        with:
          name: website-static
          path: apps/website/dist/
          retention-days: 3

  publish:
    name: Deploy approved password-gated website
    needs: [website]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.FIREBASE_PROJECT_ID != '' &&
      vars.FIREBASE_PROJECT_ID == 'dofus-companion'
    runs-on: ubuntu-latest
    environment: firebase-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enforce community publication prerequisites
        env:
          COMMUNITY_PUBLICATION_APPROVED: ${{ vars.COMMUNITY_PUBLICATION_APPROVED }}
        run: node infrastructure/community/publication-gate.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: pnpm
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile --filter @dofus/website...
      - name: Build preserving current preview access unless rotation was requested
        env:
          WEBSITE_PASSWORD: ${{ secrets.WEBSITE_PASSWORD }}
          ROTATE_PREVIEW_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.rotate_preview_password }}
          VITE_SITE_URL: ${{ vars.WEBSITE_URL }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.DISCORD_PUBLIC_CLIENT_ID }}
        run: |
          if [ "$ROTATE_PREVIEW_PASSWORD" = "true" ]; then
            if [ -z "$WEBSITE_PASSWORD" ]; then
              echo "::error::Missing WEBSITE_PASSWORD repository secret; refusing password rotation."
              exit 1
            fi
            pnpm --filter @dofus/website build
          else
            unset WEBSITE_PASSWORD
            pnpm --filter @dofus/website build:reuse-access
          fi
      - name: Deploy only Firebase Hosting (GitHub encrypted secret)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          firebaseToolsVersion: '14.22.0'
