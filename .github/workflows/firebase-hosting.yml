name: Website · Firebase Hosting (Spark)

on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'apps/desktop/public/branding/**'
      - 'apps/desktop/public/classes/**'
      - 'apps/desktop/public/game-assets/worlds/1.webp'
      - 'firebase.json'
      - '.firebaserc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firebase-hosting.yml'
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'apps/desktop/public/branding/**'
      - 'apps/desktop/public/classes/**'
      - 'apps/desktop/public/game-assets/worlds/1.webp'
      - 'firebase.json'
      - '.firebaserc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: pnpm
      - name: Install website packages only
        run: pnpm install --frozen-lockfile --filter @dofus/website...
      - name: Validate website
        run: |
          pnpm --filter @dofus/website typecheck
          pnpm --filter @dofus/website test
      - name: Build static website
        env:
          VITE_SITE_URL: ${{ vars.WEBSITE_URL }}
          VITE_DISCORD_CLIENT_ID: ${{ vars.DISCORD_PUBLIC_CLIENT_ID }}
        run: pnpm --filter @dofus/website build
      - name: Upload compiled static site
        uses: actions/upload-artifact@v4
        with:
          name: website-static
          path: apps/website/dist/
          retention-days: 3

  publish:
    name: Deploy static site (Spark, live only)
    needs: [website]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.FIREBASE_PROJECT_ID != '' &&
      vars.FIREBASE_WIF_PROVIDER != '' &&
      vars.FIREBASE_SERVICE_ACCOUNT != '' &&
      vars.LEGAL_READY == 'true'
    runs-on: ubuntu-latest
    environment: firebase-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website-static
          path: apps/website/dist/
      - name: Short-lived Google Cloud authentication (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
      - name: Deploy only Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --yes firebase-tools@14.22.0 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
