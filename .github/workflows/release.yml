name: Windows release
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - '.github/release-requests/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-state:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.state.outputs.allowed }}
      draft_exists: ${{ steps.state.outputs.draft_exists }}
    steps:
      - uses: actions/checkout@v4
      - id: state
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMUNITY_PUBLICATION_APPROVED: ${{ vars.COMMUNITY_PUBLICATION_APPROVED }}
        run: |
          $ErrorActionPreference = 'Stop'
          node infrastructure/community/publication-gate.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Community publication prerequisites are incomplete.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + $version }
          $raw = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Release state could not be verified.' }
          $releases = @($raw | ConvertFrom-Json)
          $current = @($releases | Where-Object { $_.tag_name -eq $tag })
          if ($current.Count -gt 1) { throw 'Ambiguous release state. Refusing changes.' }
          $draftExists = $current.Count -eq 1 -and $current[0].draft
          $allowed = $current.Count -eq 0
          "allowed=$($allowed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "draft_exists=$($draftExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  release:
    needs: release-state
    if: needs.release-state.outputs.allowed == 'true'
    runs-on: windows-latest
    steps:
      - name: Refuse changes to an already published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" 2>$null
            if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).draft) {
              throw 'This release is already published. Build a new version instead of replacing its assets.'
            }
          }
          $global:LASTEXITCODE = 0
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - name: Prepare bundled offline translator runtime
        shell: pwsh
        run: ./infrastructure/scripts/setup-translator.ps1
      - name: Verify update signing configuration
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Set TAURI_UPDATER_PUBLIC_KEY repository variable and TAURI_SIGNING_PRIVATE_KEY secret before a release.'
          }
          $configPath = 'apps/desktop/src-tauri/tauri.conf.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json -AsHashtable
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$($config.version)" 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).draft) {
            throw 'This version is already published. Existing assets must remain immutable.'
          }
          $global:LASTEXITCODE = 0
          $config.plugins.updater.pubkey = $env:UPDATER_PUBLIC_KEY
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $configPath -Encoding utf8
      - run: pnpm typecheck
      - run: pnpm test
      - name: Retrieve verified public catalog snapshot
        shell: pwsh
        run: |
          $catalog = Get-Content -LiteralPath design/catalog-bundle.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path .data -Force | Out-Null
          Invoke-WebRequest -Uri $catalog.url -OutFile .data/release-catalog.sqlite
          $actual = (Get-FileHash -LiteralPath .data/release-catalog.sqlite -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $catalog.sha256 -or (Get-Item -LiteralPath .data/release-catalog.sqlite).Length -ne $catalog.size) {
            throw 'Public catalog digest or size does not match the reviewed snapshot.'
          }
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          COMPANION_CATALOG_PATH: ${{ github.workspace }}/.data/release-catalog.sqlite
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: DOFUS Companion v__VERSION__
          releaseBody: 'Windows-Installer und signiertes Update. Installation und bekannte Einschränkungen: siehe README.md und IMPLEMENTATION_STATUS.md.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
      - run: ./infrastructure/scripts/package-portable.ps1
      - run: ./infrastructure/scripts/package-signed-release.ps1
      - name: Attach portable archive to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content -LiteralPath 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $portable = Get-Item -LiteralPath (Join-Path artifacts ('Dofus-Companion-' + $config.version + '-portable.zip'))
          $setup = Get-Item -LiteralPath (Join-Path artifacts ('Dofus-Companion-' + $config.version + '-setup.zip'))
          gh release upload ('v' + $config.version) $portable.FullName $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Portable-Archiv konnte nicht angehängt werden.' }
      - name: Save portable archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: artifacts/*-portable.zip

      # Builds remain drafts. Publication requires the live Firebase, native and
      # signed-installer evidence checked by infrastructure/community/publish-release.mjs.
